<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game Master</title>
<style>
:root{--bg:#eef6f6;--card:#fff;--tx:#10302f;--mut:#5b7776;--pri:#0f766e;--pri2:#14b8a6;--bd:#cfe3e2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1b1b;--card:#12292a;--tx:#e6f4f3;--mut:#9bbab8;--pri:#2dd4bf;--pri2:#0f766e;--bd:#24494a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.4}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:12px 16px;text-align:center}header h1{margin:0;font-size:1.2rem}
main{max-width:900px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut)}.center{text-align:center}.hide{display:none}button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:1rem}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
input,select{font:inherit;padding:10px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-weight:600;margin-top:10px}.big{font-size:2rem;font-weight:800;color:var(--pri)}
.q{font-size:1.4rem;font-weight:700;margin:8px 0 14px}.cat{display:inline-block;font-size:.75rem;background:var(--pri2);color:#fff;border-radius:99px;padding:2px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.opts{grid-template-columns:1fr}}
.o{border:0;border-radius:12px;padding:16px;color:#fff;font-weight:700;font-size:1.05rem;text-align:left;min-height:64px}
.o0{background:#dc2626}.o1{background:#2563eb}.o2{background:#b45309}.o3{background:#15803d}
.o.dim{opacity:.3}.o.sel{outline:4px solid var(--tx)}.o.right{outline:4px solid #facc15}
.bar{height:10px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--pri2)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-size:.8rem}tr.me td{background:rgba(20,184,166,.2);font-weight:700}
.fb{padding:10px;border-radius:10px;background:var(--bg);border-left:5px solid var(--pri);margin-top:10px}.src{color:var(--mut);font-size:.8rem}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:10px}.pill{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;margin:3px;font-size:.85rem}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:14px 0}.pod{background:var(--pri2);color:#fff;border-radius:10px 10px 0 0;padding:8px;width:30%;text-align:center}
</style></head><body><header><h1>🏛️ Budget Cycle Challenge — Game Master</h1></header><main id="root"><div class="card center mut">Connecting…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var SH=["▲","◆","●","■"],root=document.getElementById("root"),S=null,at=0,vk="",pin=new URLSearchParams(location.search).get("pin")||"";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function $(i){return document.getElementById(i)}
function rows(l){var h="<table><tr><th>#</th><th>Name</th><th>Barangay</th><th>Position</th><th>Score</th><th>Correct</th></tr>";l.forEach(function(p){h+="<tr><td>"+p.rank+"</td><td>"+esc(p.name)+"</td><td>"+esc(p.barangay)+"</td><td>"+esc(p.position)+"</td><td>"+p.score+"</td><td>"+p.right+"/"+S.total+"</td></tr>"});return h+"</table>"}
function note(t){var d=document.createElement("div");d.style.cssText="position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;max-width:90%";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},4000)}
function ask(t,yes){var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px";o.innerHTML='<div class="card" style="max-width:420px;margin:0"><p style="margin-top:0"><b>'+esc(t)+'</b></p><div class="row"><button class="btn" id="yy">Yes</button><button class="btn alt" id="nn">Cancel</button></div></div>';document.body.appendChild(o);document.getElementById("yy").onclick=function(){o.remove();yes()};document.getElementById("nn").onclick=function(){o.remove()}}
function askPin(){root.innerHTML='<div class="card center"><h2 style="margin-top:0">Game Master PIN</h2><p class="mut">Enter the PIN shown in your server window (or set as GM_PIN in Render).</p><input id="pinin" inputmode="numeric" maxlength="12" style="max-width:220px;text-align:center"><div class="row" style="justify-content:center"><button class="btn" id="pinok">Enter</button></div></div>';var go=function(){pin=document.getElementById("pinin").value.trim();if(pin)connect()};document.getElementById("pinok").onclick=go;document.getElementById("pinin").onkeydown=function(e){if(e.key==="Enter")go()}}
function act(a,b){b=b||{};b.pin=pin;return fetch("/api/gm/"+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(r){if(r.error)note(r.error)})}
function connect(){var es=new EventSource("/events?role=gm&pin="+encodeURIComponent(pin));
var errShown=false;
es.onmessage=function(e){S=JSON.parse(e.data);at=Date.now();var k=[S.phase,S.idx,S.regOpen].join("|");if(errShown){errShown=false;vk=""}if(k!==vk){vk=k;paint()}live()};
es.onerror=function(){if(S)return;errShown=true;fetch("/api/gm/check?pin="+encodeURIComponent(pin)).then(function(r){
 if(r.status===403)root.innerHTML='<div class="card center"><b>Wrong PIN.</b><br>The PIN changes every time the server restarts unless GM_PIN is set in Render (Environment). Check the Render <b>Logs</b> tab for the current PIN, then reload with ?pin=XXXX</div>';
 else root.innerHTML='<div class="card center">Reconnecting to the server… (the free Render server may be waking up; wait up to a minute)</div>'}).catch(function(){root.innerHTML='<div class="card center">Server not reachable yet. It may be waking up or restarting. Wait a minute and reload.</div>'})};}
if(pin)connect();else askPin();
function paint(){var h="",ph=S.phase;
 if(ph==="setup"){h='<div class="card"><h2 style="margin-top:0">Game setup</h2><p class="mut">Choose the question sources for this game. Questions are drawn evenly from the sources you select.</p>';
  (S.sources||[]).forEach(function(s){h+='<label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" class="srcsel" value="'+s.id+'" data-n="'+s.count+'" checked style="width:22px;height:22px"> '+esc(s.name)+' <span class="mut" style="font-weight:400">('+s.count+' questions)</span></label>'});
  h+='<div class="row"><label style="margin:0">Number of questions <input id="nq" type="number" min="1" value="15" style="width:110px"></label><label style="margin:0">Seconds per question <select id="dur" style="width:auto"><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select></label></div><p class="mut" id="pool"></p><div class="row"><button class="btn" id="open">Open registration</button></div></div>'}
 else if(ph==="lobby"){h='<div class="card center"><h2 style="margin-top:0">Scan to register</h2><p class="mut">Participants enter their name, barangay and position.</p><p class="mut">Sources: '+esc((S.selSrc||[]).join(" · "))+' · '+S.total+' questions</p><div id="qr"></div><p><input id="url" value="'+esc(location.origin+"/")+'" style="max-width:420px;text-align:center"></p><div class="big" id="cnt"></div><div id="roster"></div><div class="row" style="justify-content:center"><button class="btn" id="start">Close registration &amp; start game</button><button class="btn alt" id="reset">Reset</button></div></div>'}
 else if(ph==="question"||ph==="reveal"){var rv=ph==="reveal";
  h='<div class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="cat">'+esc(S.q.src)+' · '+esc(S.q.c)+' · Q'+(S.idx+1)+' of '+S.total+'</span><span class="big" id="clk"></span></div><div class="bar"><i id="tb"></i></div><div class="q">'+esc(S.q.t)+'</div><div class="opts">';
  S.q.o.forEach(function(t,k){var r=rv&&S.reveal.correct===k;h+='<div class="o o'+k+(rv&&!r?" dim":"")+(r?" right":"")+'">'+SH[k]+" "+esc(t)+(rv?'<span style="float:right">'+S.reveal.counts[k]+"</span>":"")+"</div>"});
  h+='</div><p id="ans" class="mut"></p>';
  if(rv)h+='<div class="fb"><b>Answer: '+esc(S.q.o[S.reveal.correct])+'</b><br>'+esc(S.reveal.e)+'<div class="src">Source: '+esc(S.reveal.s)+'</div></div><div class="row" style="justify-content:center;text-align:center;margin-top:14px"><div class="card" style="margin:0;min-width:130px"><div class="big" style="color:#15803d">'+S.who.right.length+'</div>✔ Correct</div><div class="card" style="margin:0;min-width:130px"><div class="big" style="color:#b91c1c">'+S.who.wrong.length+'</div>✘ Wrong</div><div class="card" style="margin:0;min-width:130px"><div class="big" style="color:#b45309">'+S.who.none.length+'</div>No answer</div><div class="card" style="margin:0;min-width:130px"><div class="big">'+(S.count?Math.round(S.who.right.length/S.count*100):0)+'%</div>of '+S.count+' players</div></div><h3>✔ Players who got it right ('+S.who.right.length+' of '+S.count+')</h3><div>'+(S.who.right.map(function(p){return'<span class="pill">'+esc(p.name)+' · '+esc(p.barangay)+' · '+(p.ms/1000).toFixed(1)+'s</span>'}).join("")||'<span class="mut">Nobody</span>')+'</div><details style="margin-top:8px"><summary>✘ Wrong ('+S.who.wrong.length+') &nbsp;·&nbsp; No answer ('+S.who.none.length+')</summary><p><b>Wrong:</b> '+(S.who.wrong.map(function(p){return'<span class="pill">'+esc(p.name)+' · '+esc(p.barangay)+'</span>'}).join("")||"none")+'</p><p><b>No answer:</b> '+(S.who.none.map(function(p){return'<span class="pill">'+esc(p.name)+' · '+esc(p.barangay)+'</span>'}).join("")||"none")+'</p></details><h3>Top 5</h3>'+rows(S.top);
  h+='<div class="row">'+(rv?'<button class="btn" id="next">'+(S.idx>=S.total-1?"Show final ranking":"Next question")+'</button>':'<button class="btn" id="reveal">Reveal answer now</button>')+'</div></div>'}
 else{var t=S.all,pod="";if(t.length){pod='<div class="podium">';[[1,"🥈",90],[0,"🥇",120],[2,"🥉",70]].forEach(function(x){var p=t[x[0]];if(p)pod+='<div class="pod" style="height:'+x[2]+'px">'+x[1]+"<br>"+esc(p.name)+"<br><small>"+p.score+"</small></div>"});pod+="</div>"}
  h='<div class="card"><h2 class="center" style="margin-top:0">🏆 Final ranking</h2>'+pod+rows(t)+'<div class="row" style="justify-content:center"><a class="btn" href="/api/gm/csv?pin='+encodeURIComponent(pin)+'" style="text-decoration:none">Download CSV</a><button class="btn alt" id="reset">New game</button></div></div>'}
 root.innerHTML=h;var b;
 if($("pool")){var cs=document.querySelectorAll(".srcsel");var upd=function(){var n=0;for(var i=0;i<cs.length;i++)if(cs[i].checked)n+=parseInt(cs[i].getAttribute("data-n"),10);$("pool").textContent=n+" questions available from the selected sources";$("nq").max=n;if(parseInt($("nq").value,10)>n)$("nq").value=n;$("open").disabled=!n};for(var i=0;i<cs.length;i++)cs[i].onchange=upd;upd()}
 if(b=$("open"))b.onclick=function(){var s=[],c=document.querySelectorAll(".srcsel");for(var i=0;i<c.length;i++)if(c[i].checked)s.push(c[i].value);act("open",{sources:s,nq:$("nq").value,dur:$("dur").value})};
 if(b=$("start"))b.onclick=function(){if(!S.count)ask("No one has registered yet. Start anyway?",function(){act("start")});else act("start")};
 if(b=$("reveal"))b.onclick=function(){act("reveal")};if(b=$("next"))b.onclick=function(){act("next")};
 if(b=$("reset"))b.onclick=function(){ask("Reset the game and remove all participants?",function(){act("reset")})};
 if($("url"))$("url").oninput=qr;qr()}
function qr(){var q=$("qr");if(!q||typeof QRCode==="undefined")return;q.innerHTML="";try{new QRCode(q,{text:$("url").value,width:240,height:240})}catch(e){}}
function live(){var b;if(b=$("cnt"))b.textContent=S.count+" registered";if(b=$("roster"))b.innerHTML=(S.roster||[]).map(function(p){return'<span class="pill">'+esc(p.name)+" · "+esc(p.barangay)+"</span>"}).join("");if(b=$("ans"))b.textContent=S.answered+" of "+S.count+" answered"}
setInterval(function(){if(!S||S.phase!=="question")return;var left=Math.max(0,S.left-(Date.now()-at));var c=$("clk");if(c)c.textContent=Math.ceil(left/1000)+"s";var t=$("tb");if(t)t.style.width=(left/(S.dur*1000)*100)+"%"},200);
</script></body></html>
