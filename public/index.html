<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Budget Cycle Challenge</title>
<style>
:root{--bg:#eef6f6;--card:#fff;--tx:#10302f;--mut:#5b7776;--pri:#0f766e;--pri2:#14b8a6;--bd:#cfe3e2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1b1b;--card:#12292a;--tx:#e6f4f3;--mut:#9bbab8;--pri:#2dd4bf;--pri2:#0f766e;--bd:#24494a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.4}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:12px 16px;text-align:center}header h1{margin:0;font-size:1.2rem}
main{max-width:900px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut)}.center{text-align:center}.hide{display:none}button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:1rem}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
input,select{font:inherit;padding:10px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-weight:600;margin-top:10px}.big{font-size:2rem;font-weight:800;color:var(--pri)}
.q{font-size:1.4rem;font-weight:700;margin:8px 0 14px}.cat{display:inline-block;font-size:.75rem;background:var(--pri2);color:#fff;border-radius:99px;padding:2px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.opts{grid-template-columns:1fr}}
.o{border:0;border-radius:12px;padding:16px;color:#fff;font-weight:700;font-size:1.05rem;text-align:left;min-height:64px}
.o0{background:#dc2626}.o1{background:#2563eb}.o2{background:#b45309}.o3{background:#15803d}
.o.dim{opacity:.3}.o.sel{outline:4px solid var(--tx)}.o.right{outline:4px solid #facc15}
.bar{height:10px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--pri2)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-size:.8rem}tr.me td{background:rgba(20,184,166,.2);font-weight:700}
.fb{padding:10px;border-radius:10px;background:var(--bg);border-left:5px solid var(--pri);margin-top:10px}.src{color:var(--mut);font-size:.8rem}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:10px}.pill{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;margin:3px;font-size:.85rem}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:14px 0}.pod{background:var(--pri2);color:#fff;border-radius:10px 10px 0 0;padding:8px;width:30%;text-align:center}
</style></head><body><header><h1>🏛️ Budget Cycle Challenge</h1></header><main id="root"><div class="card center mut">Connecting…</div></main>
<script>
var POS=["Punong Barangay","Barangay Kagawad","SK Chairperson","SK Kagawad","Barangay Secretary","Barangay Treasurer","Other"],SH=["▲","◆","●","■"];
var root=document.getElementById("root"),S=null,at=0,vk="",id=localStorage.getItem("bcg_id");
if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("bcg_id",id)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function $(i){return document.getElementById(i)}
function rows(l){var h="<table><tr><th>#</th><th>Name</th><th>Barangay</th><th>Position</th><th>Score</th><th>Correct</th></tr>";l.forEach(function(p){h+="<tr><td>"+p.rank+"</td><td>"+esc(p.name)+"</td><td>"+esc(p.barangay)+"</td><td>"+esc(p.position)+"</td><td>"+p.score+"</td><td>"+p.right+"/"+S.total+"</td></tr>"});return h+"</table>"}
function connect(){var es=new EventSource("/events?id="+id);es.onmessage=function(e){S=JSON.parse(e.data);at=Date.now();render()};es.onerror=function(){root.innerHTML='<div class="card center">Reconnecting…</div>';vk=""}}
function render(){var m=S.me;var key=[S.phase,S.idx,S.regOpen,!!m,m&&m.answered].join("|");if(key!==vk){vk=key;paint()}else live()}
function paint(){var h="",m=S.me;
 if(S.phase==="setup"){root.innerHTML='<div class="card center">⏳ Waiting for the Game Master to open the game…</div>';return}
 if(!m){if(!S.regOpen){root.innerHTML='<div class="card center">Registration is closed. Please wait for the next game.</div>';return}
  root.innerHTML='<div class="card"><h2 style="margin-top:0">Join the game</h2><label>Name<input id="fn" maxlength="40"></label><label>Barangay<input id="fb" maxlength="40"></label><label>Position<select id="fp">'+POS.map(function(p){return"<option>"+p+"</option>"}).join("")+'</select></label><label class="hide" id="fol">Specify position<input id="fo" maxlength="40"></label><div class="row"><button class="btn" id="join">Join</button></div><p id="err" class="src"></p></div>';
  $("fp").onchange=function(){$("fol").classList.toggle("hide",$("fp").value!=="Other")};
  $("join").onclick=function(){var p=$("fp").value;if(p==="Other")p=$("fo").value||"Other";post("/api/join",{id:id,name:$("fn").value,barangay:$("fb").value,position:p},function(r){if(r.error)$("err").textContent=r.error})};return}
 if(S.phase==="lobby"){root.innerHTML='<div class="card center"><div class="big">You’re in, '+esc(m.name)+'! ✅</div><p class="mut">Waiting for the Game Master to start…</p></div>';return}
 if(S.phase==="question"||S.phase==="reveal"){var rv=S.phase==="reveal";
  h='<div class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="cat">'+esc(S.q.src)+' · Q'+(S.idx+1)+' of '+S.total+'</span><span class="big" id="clk"></span></div><div class="bar"><i id="tb"></i></div><div class="q">'+esc(S.q.t)+'</div><div class="opts">';
  S.q.o.forEach(function(t,k){var c=(m.k===k?" sel":"")+(rv&&S.reveal.correct===k?" right":"")+(rv&&S.reveal.correct!==k&&m.k!==k?" dim":"");h+='<button class="o o'+k+c+'" data-k="'+k+'"'+((m.answered||rv)?" disabled":"")+'>'+SH[k]+" "+esc(t)+"</button>"});
  h+="</div>";
  if(!rv&&m.answered)h+='<p class="center big">Answer locked ✓</p><p class="center mut">Waiting for the others…</p>';
  if(rv){var ok=m.answered&&m.k===S.reveal.correct;h+='<div class="fb"><b>'+(m.answered?(ok?"✔ Correct! +"+m.pts:"✘ Not quite."):"⏰ No answer.")+'</b><br>Correct: '+esc(S.q.o[S.reveal.correct])+'<br>'+esc(S.reveal.e)+'<div class="src">Source: '+esc(S.reveal.s)+'</div></div><p class="center">Your score: <b>'+m.score+'</b> · Rank <b>'+m.rank+'</b> of '+S.count+'</p>'}
  root.innerHTML=h+"</div>";var bs=root.querySelectorAll(".o");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){post("/api/answer",{id:id,k:parseInt(this.dataset.k,10)})};return}
 if(S.phase==="final"){root.innerHTML='<div class="card"><h2 class="center" style="margin-top:0">🏁 Game over</h2><p class="center big">Your rank: '+m.rank+' of '+S.count+'</p><p class="center">Score: <b>'+m.score+'</b></p>'+rows(S.top)+'</div>'}}
function live(){}
function post(u,b,cb){fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(r){if(cb)cb(r)}).catch(function(){})}
setInterval(function(){if(!S||S.phase!=="question")return;var left=Math.max(0,S.left-(Date.now()-at));var c=$("clk");if(c)c.textContent=Math.ceil(left/1000)+"s";var t=$("tb");if(t)t.style.width=(left/(S.dur*1000)*100)+"%";if(left<=0){var b=document.querySelectorAll(".o");for(var i=0;i<b.length;i++)b[i].disabled=true}},200);
connect();
</script></body></html>
